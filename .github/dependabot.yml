# AviUtl2 のプラグイン SDK（plugin/sdk）のミラーは、公式の更新からほぼ即時に更新される。
# これを AviUtl2 の更新の合図として、submodule を更新する pull request を作る。
version: 2
updates:
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: daily

  # Python の依存（pillow / pytest / xxhash / ruff / ty など）の更新を、uv.lock の更新として追いかける。
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly

  # Actions の更新（Node のバージョン対応など）も追いかける。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
